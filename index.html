<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELECTRO-LAB: 전기음성도와 화학 결합 시뮬레이션</title>
    <!-- Google Fonts: Orbitron (for titles/numbers), Inter (for text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN (Three.js removed for 100% stable 2D canvas) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="cyber-overlay"></div>
    
    <header class="cyber-header">
        <div class="header-logo">
            <span class="glitch" data-text="ELECTRO-LAB">ELECTRO-LAB</span>
            <span class="subtitle">// CHEMICAL BONDING SANDBOX</span>
        </div>
        <div class="sandbox-badge">
            <span>2D LAB MODE</span>
        </div>
    </header>

    <main class="dashboard-grid">
        <!-- Left Column: Information Display & Element Picker -->
        <section class="panel left-panel">
            <!-- Bond Information Panel -->
            <div class="cyber-card glass info-card" id="infoCard">
                <div class="card-header">
                    <span class="card-icon">📊</span>
                    <h2>BOND ANALYSIS</h2>
                </div>
                <div class="card-content">
                    <div class="bond-summary">
                        <div class="summary-row">
                            <span class="summary-label">결합 원소:</span>
                            <span class="summary-val" id="bondElements">C - H</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">전기음성도 차이 (ΔEN):</span>
                            <span class="summary-val highlight" id="enDifference">0.35</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">이온 결합성 백분율:</span>
                            <span class="summary-val" id="ionicPercent">3.0%</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">예상 결합 유형:</span>
                            <span class="summary-val badge" id="bondType">무극성 공유 결합</span>
                        </div>
                    </div>
                    <div class="bond-description-box">
                        <p id="bondDescription">두 원소의 전기음성도 차이가 매우 작아 공유 전자쌍이 중심에 거의 균등하게 분포합니다.</p>
                    </div>
                </div>
            </div>

            <!-- Periodic Table Selection Panel -->
            <div class="cyber-card glass selector-card">
                <div class="card-header">
                    <span class="card-icon">⚙️</span>
                    <h2>ELEMENT SELECTOR</h2>
                </div>
                <div class="card-content">
                    <div class="slot-toggle-container">
                        <button class="slot-toggle active" id="slotABtn" data-slot="A">
                            <span class="slot-indicator">●</span> ATOM A
                            <span class="selected-el-name" id="selectedAName">-</span>
                        </button>
                        <button class="slot-toggle" id="slotBBtn" data-slot="B">
                            <span class="slot-indicator">●</span> ATOM B
                            <span class="selected-el-name" id="selectedBName">-</span>
                        </button>
                    </div>
                    
                    <div class="periodic-table-grid" id="periodicTable">
                        <!-- Periodic table elements injected here via JS -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Column: 2D Visualization & Graph Analysis -->
        <section class="panel right-panel">
            <!-- 2D Visualization Canvas -->
            <div class="cyber-card glass visualization-card">
                <div class="card-header">
                    <span class="card-icon">🌀</span>
                    <h2>2D ELECTRON DENSITY MODEL</h2>
                    <div class="legend">
                        <span class="legend-item"><span class="legend-color a-color"></span>Atom A</span>
                        <span class="legend-item"><span class="legend-color b-color"></span>Atom B</span>
                    </div>
                </div>
                <div class="card-content visualizer-container" id="canvasContainer">
                    <canvas id="bondCanvas"></canvas>
                </div>
            </div>

            <!-- Graph Analysis -->
            <div class="cyber-card glass graph-card">
                <div class="card-header">
                    <span class="card-icon">📈</span>
                    <h2>BONDING CHARACTER GRAPH</h2>
                </div>
                <div class="card-content graph-container">
                    <canvas id="paulingChart"></canvas>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
